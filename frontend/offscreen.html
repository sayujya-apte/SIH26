<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>offscreen</title>
</head>
<body>
  <!--
    This page exists solely because onnxruntime-web's WASM backend uses a
    dynamic import() internally, which the HTML spec disallows inside a
    ServiceWorkerGlobalScope. An offscreen document is a normal DOM window
    under the hood, so it doesn't have that restriction. Model inference
    runs here; background.js still owns the screenshot capture, drawing the
    redaction boxes, and saving the file to Downloads.
  -->
  <script src="lib/ort/ort.min.js"></script>
  <script src="lib/webredact-detector.classic.js"></script>
  <script src="offscreen.js"></script>
</body>
</html>
